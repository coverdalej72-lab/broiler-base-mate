    <!-- ─── Multi-farm support (Ops Manager pack) ──────────────────────
         Reads ?farm=slug (URL) or stored selection, then monkey-patches
         fetch() so every /api/* call carries ?farm=<slug>. A floating
         farm switcher widget mounts after page load. -->
    <script>
      (function () {
        try {
          var qp = new URLSearchParams(window.location.search);
          var urlFarm = qp.get("farm");
          if (urlFarm) localStorage.setItem("bbm-farm-slug", urlFarm);
          var slug = localStorage.getItem("bbm-farm-slug") || "default";
          window.__BBM_FARM__ = slug;

          var origFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            try {
              var urlStr = typeof input === "string" ? input : (input && input.url);
              if (urlStr && urlStr.startsWith("/api/")) {
                var u = new URL(urlStr, window.location.origin);
                if (!u.searchParams.has("farm")) {
                  u.searchParams.set("farm", window.__BBM_FARM__ || "default");
                  var newUrl = u.pathname + (u.search ? u.search : "");
                  if (typeof input === "string") input = newUrl;
                  else input = new Request(newUrl, input);
                }
              }
            } catch (e) { /* ignore */ }
            return origFetch(input, init);
          };
        } catch (e) { console.warn("farm-init", e); }
      })();
    </script>

  <body>
    <div id="root">
      <div id="html-splash" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f3d24;gap:16px;">
        <img src="/logo.png" alt="Farm Buddy" style="height:56px;width:auto;" onerror="this.style.display='none'" />
        <div style="width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;animation:sp 0.8s linear infinite;"></div>
        <p style="color:rgba(255,255,255,0.8);font-family:sans-serif;font-size:14px;margin:0;">Loading Broiler Base Mate…</p>
        <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      // Remove splash once React mounts; also mount the farm switcher
      var __bbm_switcher_mounted = false;
      document.addEventListener("DOMContentLoaded", function() {
        var obs = new MutationObserver(function() {
          var splash = document.getElementById("html-splash");
          if (splash && document.getElementById("root").children.length > 1) {
            splash.remove(); obs.disconnect();
            mountFarmSwitcher();
          }
        });
        obs.observe(document.getElementById("root"), { childList: true, subtree: true });
      });
      // Fallback: always try mounting after window load, in case the splash race didn't trigger
      window.addEventListener("load", function () { setTimeout(mountFarmSwitcher, 1200); });

      // ─── Floating Farm Switcher (Ops Manager pack) ─────────────────
      function mountFarmSwitcher() {
        if (__bbm_switcher_mounted) return;
        // Re-bypass interceptor to fetch the raw list (we want ALL farms, not scoped)
        fetch("/api/farms?farm=").then(function (r) { return r.json(); }).then(function (farms) {
          if (!Array.isArray(farms)) return;
          // Hide the switcher entirely if there's only the default farm
          if (farms.length <= 1) return;
          if (document.getElementById("bbm-farm-switcher")) return;
          __bbm_switcher_mounted = true;

          var current = window.__BBM_FARM__ || "default";
          var wrap = document.createElement("div");
          wrap.id = "bbm-farm-switcher";
          wrap.setAttribute("data-testid", "farm-switcher");
          wrap.style.cssText = "position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9999;background:#0f3d24;color:#fff;padding:6px 10px;border-radius:99px;display:flex;align-items:center;gap:8px;font:600 12px system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.2);border:1px solid rgba(201,162,39,.5);";

          var label = document.createElement("span");
          label.textContent = "🚜 Farm:";
          label.style.cssText = "color:#bdd3c4;letter-spacing:0.3px;";

          var select = document.createElement("select");
          select.setAttribute("data-testid", "farm-switcher-select");
          select.style.cssText = "background:#1a5c36;color:#fff;border:0;padding:5px 8px;border-radius:99px;font:700 12px system-ui,sans-serif;cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:18px;background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><polygon points='0,2 10,2 5,8' fill='%23fff'/></svg>\");background-repeat:no-repeat;background-position:right 6px center;";

          farms.forEach(function (f) {
            var opt = document.createElement("option");
            opt.value = f.slug;
            opt.textContent = f.name + (f.isDefault ? "  (default)" : "");
            if (f.slug === current) opt.selected = true;
            select.appendChild(opt);
          });

          select.addEventListener("change", function () {
            localStorage.setItem("bbm-farm-slug", select.value);
            var url = new URL(window.location.href);
            url.searchParams.set("farm", select.value);
            window.location.href = url.toString();
          });

          var opsLink = document.createElement("a");
          opsLink.href = "/ops-dashboard";
          opsLink.textContent = "Ops →";
          opsLink.setAttribute("data-testid", "open-ops-dashboard");
          opsLink.style.cssText = "color:#C9A227;text-decoration:none;font-weight:800;letter-spacing:0.3px;padding-left:6px;border-left:1px solid rgba(255,255,255,.2);";

          wrap.appendChild(label);
          wrap.appendChild(select);
          wrap.appendChild(opsLink);
          document.body.appendChild(wrap);
        }).catch(function (e) { console.warn("farm-switcher", e); });
      }
    </script>
