<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A1118" />
  <link rel="manifest" href="/reader-assets/mort-buddy-manifest.json" />
  <link rel="icon" type="image/png" href="/reader-assets/icon-192.png" />
  <link rel="apple-touch-icon" href="/reader-assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mort Buddy" />
  <meta name="format-detection" content="telephone=no" />
  <title>Mort Buddy — Record Morts, Culls &amp; Weights</title>
  <style>
    :root {
      --bg: #0f1a2f; --panel: #1b2540; --line: #2a3a5c; --ink: #eef3fa; --muted: #8a99b8;
      --red: #ef4444; --red-soft: #2a1a22; --orange: #f59e0b; --orange-soft: #2a2118;
      --green: #2dbd5e; --green-600: #29a352; --teal: #22b8b0; --teal-soft: #142826;
      --gold: #C9A227;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; -webkit-font-smoothing: antialiased; }
    header { padding: 18px 16px 10px; text-align: center; border-bottom: 1px solid var(--line); }
    header .brand-row { display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 8px; }
    header .brand-row img { width: 22px; height: 22px; border-radius: 6px; }
    header .brand-row span { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--teal); }
    header .farm { font-weight: 800; font-size: 18px; }
    header .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 14px 14px 90px; }
    .shed-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .shed-card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .shed-card .head .num { font-size: 17px; font-weight: 900; }
    .shed-card .head .saved-badge { font-size: 11px; color: var(--green); font-weight: 700; opacity: 0; transition: opacity .2s; }
    .shed-card .head .saved-badge.show { opacity: 1; }
    .fields { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
    .field label { display: block; font-size: 10px; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
    .field.morts label { color: var(--red); }
    .field.culls label { color: var(--orange); }
    .field.weight label { color: var(--teal); }
    .field.age label { color: var(--gold); }
    .field select, .field input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 16px;
      text-align: center; font-weight: 700; color: var(--ink); background: #142038; }
    .field.morts input { background: var(--red-soft); }
    .field.culls input { background: var(--orange-soft); }
    .field.weight input { background: var(--teal-soft); }
    .save-btn { background: var(--green); color: #fff; border: 0; border-radius: 8px; padding: 11px 16px;
      font-size: 13px; font-weight: 800; cursor: pointer; }
    .save-btn:disabled { opacity: 0.5; }
    .save-btn:active { background: var(--green-600); }
    .loading, .error { text-align: center; padding: 40px 20px; color: var(--muted); }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--green);
      color: #fff; padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 700; box-shadow: 0 6px 20px -6px rgba(0,0,0,0.5);
      opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; }
    .toast.show { opacity: 1; }
    .toast.err { background: var(--red); }
    .tabbar { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--muted);
      border-radius: 10px; padding: 11px 8px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .tab-btn.active { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
    .panel { display: none; }
    .panel.active { display: block; }
    .unit-toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
    .unit-toggle button { flex: 1; background: #142038; border: 0; color: var(--muted); font-weight: 800;
      font-size: 12px; padding: 10px 4px; cursor: pointer; }
    .unit-toggle button.active { background: var(--teal); color: #06231f; }
    .weigh-log-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px;
      border-bottom: 1px solid var(--line); font-size: 13px; }
    .weigh-log-item:last-child { border-bottom: 0; }
    .weigh-log-item .w-shed { font-weight: 800; }
    .weigh-log-item .w-meta { color: var(--muted); font-size: 11px; }
    .empty-log { text-align: center; color: var(--muted); font-size: 12px; padding: 10px; }
    .age-chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .age-chip { background: #142038; border: 1px solid var(--line); color: var(--muted); font-weight: 800;
      font-size: 12px; padding: 9px 14px; border-radius: 99px; cursor: pointer; }
    .age-chip.active { background: var(--gold); color: #1a1000; border-color: var(--gold); }
    .weigh-shed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }

    /* Sep 2026 — "boring chrome" fix (Jason): installed/standalone-mode PWA
       splash for the no-login Staff QR page — previously had zero manifest,
       zero splash, opened as a completely bare tab. Normal browser tab
       visits are unaffected — this only shows when added to the home
       screen / opened standalone. */
    #mb-splash { display: none; }
    @media (display-mode: standalone) { #mb-splash { display: flex !important; } }
    body.bbm-mb-standalone #mb-splash { display: flex !important; }
    @keyframes bbm-mb-splash-pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes bbm-mb-splash-fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
<script>
  try { if (window.navigator && window.navigator.standalone) document.body.classList.add("bbm-mb-standalone"); } catch (_) {}
</script>
<div id="mb-splash" style="position:fixed;inset:0;z-index:99999;background:#0A1118;color:#eef3fa;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;animation:bbm-mb-splash-fade 0.3s ease;">
  <div style="width:74px;height:74px;border-radius:20px;background:radial-gradient(circle at 32% 28%, rgba(16,185,129,0.35), rgba(10,17,24,0) 70%);display:grid;place-items:center;animation:bbm-mb-splash-pulse 1.8s ease-in-out infinite;">
    <img src="/reader-assets/icon-192.png" alt="Mort Buddy" style="height:56px;width:56px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,0.4);" onerror="this.style.display='none'" />
  </div>
  <div style="font-weight:900;letter-spacing:0.5px;font-size:16px;">BBM MORT BUDDY</div>
  <div style="font-size:11px;color:#10B981;letter-spacing:2px;font-weight:700;">SHED DIRECT</div>
</div>
<script>
  (function () {
    var hide = function () {
      var el = document.getElementById("mb-splash");
      if (el) el.style.display = "none";
    };
    window.addEventListener("load", function () { setTimeout(hide, 650); });
    setTimeout(hide, 4000);
  })();
</script>
  <header>
    <div class="brand-row"><img src="/reader-assets/icon-192.png" alt="" onerror="this.style.display='none'" /><span>BROILER BASE MATE · MORT BUDDY</span></div>
    <div class="farm" id="farm-name">Loading…</div>
    <div class="sub" id="today-label"></div>
  </header>
  <div class="wrap">
    <div class="shed-card" id="name-card" style="margin-bottom:14px;">
      <div class="field" style="margin:0;">
        <label style="color:var(--green);">YOUR NAME</label>
        <input type="text" id="staff-name" data-testid="staff-name-input" placeholder="e.g. Sarah" style="background:#142038;text-align:left;font-weight:600;" />
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;">So the farm owner knows who recorded what. Saved on this phone.</div>
    </div>

    <div class="tabbar">
      <button class="tab-btn active" id="tab-btn-morts" data-testid="tab-morts-culls">🐔 Morts &amp; Culls</button>
      <button class="tab-btn" id="tab-btn-weigh" data-testid="tab-weigh-birds">⚖️ Weigh Birds</button>
    </div>

    <div class="panel active" id="panel-morts">
      <div id="content"><div class="loading">Loading sheds…</div></div>
    </div>

    <div class="panel" id="panel-weigh">
      <div class="shed-card">
        <div class="fields" style="grid-template-columns: 1fr; gap: 10px;">
          <div class="field age">
            <label>AGE (DAY) — PICK A CHECK DAY</label>
            <div class="age-chip-row" data-testid="weigh-age-chips">
              <button type="button" class="age-chip" data-age="7" data-testid="weigh-age-chip-7">Day 7</button>
              <button type="button" class="age-chip" data-age="14" data-testid="weigh-age-chip-14">Day 14</button>
              <button type="button" class="age-chip active" data-age="21" data-testid="weigh-age-chip-21">Day 21</button>
              <button type="button" class="age-chip" data-age="28" data-testid="weigh-age-chip-28">Day 28</button>
              <button type="button" class="age-chip" data-age="custom" data-testid="weigh-age-chip-custom">Custom</button>
            </div>
            <input type="number" inputmode="numeric" min="0" id="weigh-age-custom" data-testid="weigh-age-custom-input" placeholder="Enter day" style="display:none;margin-top:8px;" />
          </div>
          <div class="field weight">
            <label>UNIT</label>
            <div class="unit-toggle" data-testid="weigh-unit-toggle">
              <button type="button" id="unit-g" data-testid="weigh-unit-g">g</button>
              <button type="button" id="unit-kg" class="active" data-testid="weigh-unit-kg">kg</button>
            </div>
          </div>
        </div>
      </div>
      <div id="weigh-shed-list"><div class="loading">Loading sheds…</div></div>
      <div class="shed-card">
        <div class="head"><span class="num" style="font-size:13px;">TODAY'S WEIGHINGS</span></div>
        <div id="weigh-log"><div class="empty-log">Nothing recorded yet today.</div></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const NAME_KEY = "bbm-staff-name";
    const nameInput = document.getElementById("staff-name");
    nameInput.value = localStorage.getItem(NAME_KEY) || "";
    nameInput.addEventListener("input", () => { localStorage.setItem(NAME_KEY, nameInput.value); });

    const qs = new URLSearchParams(window.location.search);
    const farm = qs.get("farm") || "default";
    const token = qs.get("t") || "";
    const authQ = "farm=" + encodeURIComponent(farm) + (token ? "&t=" + encodeURIComponent(token) : "");
    const today = new Date();
    const todayIso = today.toISOString().slice(0, 10);
    document.getElementById("today-label").textContent =
      "Today · " + today.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "short" });

    function toast(msg, isErr) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show" + (isErr ? " err" : "");
      setTimeout(() => { el.className = "toast"; }, 2200);
    }

    // ── Tabs ──────────────────────────────────────────────────────────────
    const tabBtnMorts = document.getElementById("tab-btn-morts");
    const tabBtnWeigh = document.getElementById("tab-btn-weigh");
    const panelMorts = document.getElementById("panel-morts");
    const panelWeigh = document.getElementById("panel-weigh");
    tabBtnMorts.addEventListener("click", () => {
      tabBtnMorts.classList.add("active"); tabBtnWeigh.classList.remove("active");
      panelMorts.classList.add("active"); panelWeigh.classList.remove("active");
    });
    tabBtnWeigh.addEventListener("click", () => {
      tabBtnWeigh.classList.add("active"); tabBtnMorts.classList.remove("active");
      panelWeigh.classList.add("active"); panelMorts.classList.remove("active");
    });

    let totalShedsGlobal = 20;

    async function init() {
      try {
        const cfgRes = await fetch("/api/farm-config?" + authQ, { credentials: "include" });
        if (!cfgRes.ok) throw new Error("auth");
        const cfg = await cfgRes.json();
        document.getElementById("farm-name").textContent = cfg.farmName || "Farm";
        const totalSheds = cfg.totalSheds || 20;
        totalShedsGlobal = totalSheds;

        // Prefill with anything already recorded today (either entered here before, or synced from BBM itself)
        let existing = {};
        try {
          const morRes = await fetch("/api/integrations/morts?" + authQ + "&since=" + todayIso, { credentials: "include" });
          if (morRes.ok) {
            const data = await morRes.json();
            (data.entries || []).forEach(e => { if (e.date === todayIso) existing[e.shed] = e; });
          }
        } catch (_) { /* prefill is best-effort */ }

        const content = document.getElementById("content");
        content.innerHTML = "";
        for (let s = 1; s <= totalSheds; s++) {
          const card = document.createElement("div");
          card.className = "shed-card";
          const preM = existing[s]?.morts ?? "";
          const preC = existing[s]?.culls ?? "";
          const lastBy = existing[s]?.staffName
            ? `<div style="font-size:10px;color:var(--muted);margin-top:2px;">Last by ${existing[s].staffName}${existing[s].updatedAt ? " · " + new Date(existing[s].updatedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""}</div>`
            : "";
          card.innerHTML = `
            <div class="head"><span class="num">Shed ${s}${lastBy}</span><span class="saved-badge" data-badge="${s}">✓ Saved</span></div>
            <div class="fields">
              <div class="field morts"><label>MORTS</label><input type="number" inputmode="numeric" min="0" data-morts="${s}" data-testid="morts-input-${s}" value="${preM}" /></div>
              <div class="field culls"><label>CULLS</label><input type="number" inputmode="numeric" min="0" data-culls="${s}" data-testid="culls-input-${s}" value="${preC}" /></div>
              <button class="save-btn" data-save="${s}" data-testid="save-shed-${s}">Save</button>
            </div>`;
          content.appendChild(card);
        }

        content.querySelectorAll("[data-save]").forEach(btn => {
          btn.addEventListener("click", async () => {
            const s = btn.getAttribute("data-save");
            const staffName = nameInput.value.trim();
            if (!staffName) {
              toast("Add your name first", true);
              nameInput.focus();
              nameInput.scrollIntoView({ behavior: "smooth", block: "center" });
              return;
            }
            const morts = parseInt(document.querySelector(`[data-morts="${s}"]`).value, 10) || 0;
            const culls = parseInt(document.querySelector(`[data-culls="${s}"]`).value, 10) || 0;
            btn.disabled = true;
            btn.textContent = "Saving…";
            try {
              const res = await fetch("/api/integrations/morts?" + authQ, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ source: "bbm-staff-qr", entries: [{ shed: parseInt(s, 10), date: todayIso, morts, culls, staffName }] }),
              });
              if (!res.ok) throw new Error("save failed");
              const badge = document.querySelector(`[data-badge="${s}"]`);
              badge.classList.add("show");
              setTimeout(() => badge.classList.remove("show"), 2500);
              toast(`Shed ${s} saved`);
            } catch (e) {
              toast("Couldn't save — try again", true);
            } finally {
              btn.disabled = false;
              btn.textContent = "Save";
            }
          });
        });

        initWeighTab();
      } catch (e) {
        document.getElementById("content").innerHTML =
          '<div class="error">This link has expired or is invalid.<br/>Ask the farm owner for a fresh QR code.</div>';
        document.getElementById("panel-weigh").innerHTML =
          '<div class="error">This link has expired or is invalid.<br/>Ask the farm owner for a fresh QR code.</div>';
      }
    }

    // ── Weigh Birds tab — Sep 2026 redesign (Jason): manual weight only, one
    // card per shed like Morts & Culls, and age picked from the standard
    // industry check days (7/14/21/28) instead of typing an exact day every
    // time — Farm Buddy doesn't know each shed's real placement date (that
    // only lives in the desktop spreadsheet), so this keeps it simple rather
    // than guessing wrong.
    let weighUnit = "kg";
    let selectedAge = 21;
    let allWeighEntries = [];

    function initWeighTab() {
      const unitG = document.getElementById("unit-g");
      const unitKg = document.getElementById("unit-kg");
      unitG.addEventListener("click", () => { weighUnit = "g"; unitG.classList.add("active"); unitKg.classList.remove("active"); });
      unitKg.addEventListener("click", () => { weighUnit = "kg"; unitKg.classList.add("active"); unitG.classList.remove("active"); });

      const customInput = document.getElementById("weigh-age-custom");
      document.querySelectorAll(".age-chip").forEach(chip => {
        chip.addEventListener("click", async () => {
          document.querySelectorAll(".age-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          if (chip.dataset.age === "custom") {
            customInput.style.display = "block";
            customInput.focus();
            selectedAge = parseInt(customInput.value, 10) || selectedAge;
          } else {
            customInput.style.display = "none";
            selectedAge = parseInt(chip.dataset.age, 10);
            await loadAllWeighEntries();
            renderShedList();
          }
        });
      });
      customInput.addEventListener("input", async () => {
        const v = parseInt(customInput.value, 10);
        if (!isNaN(v) && v >= 0) { selectedAge = v; await loadAllWeighEntries(); renderShedList(); }
      });

      loadAllWeighEntries().then(renderShedList);
      refreshWeighLog();
    }

    async function loadAllWeighEntries() {
      try {
        const res = await fetch("/api/integrations/weighins?" + authQ, { credentials: "include" });
        if (!res.ok) return;
        const data = await res.json();
        allWeighEntries = data.entries || [];
      } catch (_) { /* keep whatever we had */ }
    }

    function renderShedList() {
      const wrap = document.getElementById("weigh-shed-list");
      wrap.innerHTML = "";
      for (let s = 1; s <= totalShedsGlobal; s++) {
        const existing = allWeighEntries.find(e => e.shed === s && e.age === selectedAge);
        const preKg = existing ? (existing.weightGrams / (weighUnit === "kg" ? 1000 : 1)).toFixed(weighUnit === "kg" ? 3 : 0) : "";
        const lastBy = existing?.staffName ? `<span style="font-size:10px;color:var(--muted);margin-left:8px;">Last by ${existing.staffName}</span>` : "";
        const card = document.createElement("div");
        card.className = "shed-card";
        card.innerHTML = `
          <div class="head"><span class="num">Shed ${s}${lastBy}</span><span class="saved-badge" data-wbadge="${s}">✓ Saved</span></div>
          <div class="weigh-shed-row">
            <div class="field weight" style="margin:0;"><label>WEIGHT (${weighUnit.toUpperCase()})</label>
              <input type="number" inputmode="decimal" min="0" step="0.001" data-wval="${s}" data-testid="weigh-value-${s}" value="${preKg}" placeholder="e.g. ${weighUnit === 'kg' ? '1.050' : '1050'}" />
            </div>
            <button class="save-btn" data-wsave="${s}" data-testid="weigh-save-${s}">Save</button>
          </div>`;
        wrap.appendChild(card);
      }
      wrap.querySelectorAll("[data-wsave]").forEach(btn => btn.addEventListener("click", () => saveWeighIn(parseInt(btn.dataset.wsave, 10))));
    }

    async function saveWeighIn(shed) {
      const staffName = nameInput.value.trim();
      if (!staffName) {
        toast("Add your name first", true);
        nameInput.focus();
        nameInput.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const rawVal = parseFloat(document.querySelector(`[data-wval="${shed}"]`).value);
      if (isNaN(rawVal) || rawVal <= 0) { toast("Enter the weight", true); return; }
      const weightGrams = weighUnit === "kg" ? rawVal * 1000 : rawVal;
      const age = selectedAge;

      const btn = document.querySelector(`[data-wsave="${shed}"]`);
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        const res = await fetch("/api/integrations/weighins?" + authQ, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ source: "bbm-staff-qr", entries: [{ shed, age, date: todayIso, weightGrams, staffName }] }),
        });
        if (!res.ok) throw new Error("save failed");
        toast(`Shed ${shed}, Day ${age} weight saved`);
        const idx = allWeighEntries.findIndex(e => e.shed === shed && e.age === age);
        const record = { shed, age, date: todayIso, weightGrams, staffName };
        if (idx >= 0) allWeighEntries[idx] = record; else allWeighEntries.push(record);
        const badge = document.querySelector(`[data-wbadge="${shed}"]`);
        badge.classList.add("show");
        setTimeout(() => badge.classList.remove("show"), 2500);
        await refreshWeighLog();
      } catch (e) {
        toast("Couldn't save — try again", true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save";
      }
    }

    async function refreshWeighLog() {
      const logEl = document.getElementById("weigh-log");
      try {
        const res = await fetch("/api/integrations/weighins?" + authQ + "&since=" + todayIso, { credentials: "include" });
        if (!res.ok) throw new Error("load failed");
        const data = await res.json();
        const entries = (data.entries || []).filter(e => e.date === todayIso);
        if (entries.length === 0) {
          logEl.innerHTML = '<div class="empty-log">Nothing recorded yet today.</div>';
          return;
        }
        logEl.innerHTML = entries.map(e => `
          <div class="weigh-log-item">
            <span class="w-shed">Shed ${e.shed} · Day ${e.age}</span>
            <span>${(e.weightGrams / 1000).toFixed(3)} kg</span>
            <span class="w-meta">${e.staffName || ""}</span>
          </div>`).join("");
      } catch (_) {
        logEl.innerHTML = '<div class="empty-log">Nothing recorded yet today.</div>';
      }
    }

    init();
  </script>
</body>
</html>
