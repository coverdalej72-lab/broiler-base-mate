<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Broiler Base Mate app icon">
  <!--
    Chrome-style circular app icon for the home screen.
    3 pie slices in the Appcovi palette (deep green pasture · gold feed · navy brand)
    with a central white disc and a bold gold "B" wordmark.
    Center: (256, 256)   Outer r: 240
    Slice angles (clockwise from top):
      TOP        : -90°  →  +30°  · Green   (broiler pasture)
      BOT-RIGHT  : +30°  → +150°  · Gold    (feed / grain)
      BOT-LEFT   : +150° → +270°  · Navy    (Appcovi brand)
    White stroke = 10px separator between slices.
  -->
  <defs>
    <!-- Soft radial highlight to give the "app icon" polish -->
    <radialGradient id="hi" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerShadow" cx="50%" cy="55%" r="55%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <!-- Slight bevel on the letter B -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c449"/>
      <stop offset="100%" stop-color="#b0871a"/>
    </linearGradient>
  </defs>

  <!-- White outer badge (also acts as the separator ring) -->
  <circle cx="256" cy="256" r="248" fill="#ffffff"/>

  <!-- 3 colored pie slices -->
  <!-- TOP · Deep green pasture -->
  <path d="M 256 256 L 256 16 A 240 240 0 0 1 463.85 376 Z"
        fill="#1a7a40" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <!-- BOTTOM-RIGHT · Gold feed -->
  <path d="M 256 256 L 463.85 376 A 240 240 0 0 1 48.15 376 Z"
        fill="#C9A227" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <!-- BOTTOM-LEFT · Navy brand -->
  <path d="M 256 256 L 48.15 376 A 240 240 0 0 1 256 16 Z"
        fill="#1e2f4d" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>

  <!-- Center white disc -->
  <circle cx="256" cy="256" r="118" fill="#ffffff"/>
  <!-- Subtle inner shadow on the disc so it feels recessed -->
  <circle cx="256" cy="256" r="118" fill="url(#innerShadow)"/>

  <!-- Bold gold "B" monogram, centred -->
  <text x="256" y="304"
        text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial Black', system-ui, sans-serif"
        font-weight="900"
        font-size="180"
        letter-spacing="-6"
        fill="url(#gold)">B</text>

  <!-- Glossy top-left highlight over everything -->
  <circle cx="256" cy="256" r="248" fill="url(#hi)"/>
</svg>
