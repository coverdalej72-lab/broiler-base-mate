<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Broiler Base Mate logo">
  <!-- Background rounded square -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#0f3d24"/>
  <!-- Gold ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#C9A227" stroke-width="2.4" opacity="0.65"/>

  <!-- Silo body -->
  <g transform="translate(64 70)">
    <!-- main cylinder -->
    <rect x="-22" y="-18" width="44" height="42" rx="3" fill="#f1f6ec"/>
    <!-- horizontal panel lines -->
    <line x1="-22" y1="-6" x2="22" y2="-6" stroke="#9bb38a" stroke-width="1"/>
    <line x1="-22" y1="6" x2="22" y2="6" stroke="#9bb38a" stroke-width="1"/>
    <line x1="-22" y1="18" x2="22" y2="18" stroke="#9bb38a" stroke-width="1"/>
    <!-- conical roof -->
    <path d="M -24 -18 L 0 -38 L 24 -18 Z" fill="#C9A227"/>
    <!-- top vent -->
    <rect x="-3" y="-42" width="6" height="6" rx="1" fill="#C9A227"/>
    <!-- silo base -->
    <rect x="-26" y="22" width="52" height="4" rx="1" fill="#7a8f6a"/>
    <!-- shadow on silo -->
    <rect x="14" y="-18" width="8" height="42" rx="0" fill="#c3d3b5" opacity="0.7"/>
  </g>

  <!-- Rooster silhouette in front-right -->
  <g transform="translate(82 80)" fill="#C9A227">
    <!-- body -->
    <path d="M 0 14
             C -6 14 -10 10 -10 4
             C -10 -2 -6 -6 -2 -6
             L 6 -6
             C 12 -6 16 -2 16 4
             C 16 10 12 14 6 14
             Z"/>
    <!-- tail feathers -->
    <path d="M -8 6
             C -14 4 -18 -2 -16 -8
             C -12 -6 -10 -4 -10 0
             Z"/>
    <!-- head -->
    <circle cx="12" cy="-10" r="5"/>
    <!-- beak -->
    <path d="M 16 -10 L 21 -8 L 16 -7 Z" fill="#e8a02a"/>
    <!-- comb -->
    <path d="M 9 -15
             q 1 -3 3 -2
             q 1 -2 3 -1
             q 1 -2 3 0
             L 17 -13 Z" fill="#d44530"/>
    <!-- wattle -->
    <path d="M 13 -6 q 1 2 -1 3 q -2 1 -2 -1 Z" fill="#d44530"/>
    <!-- eye -->
    <circle cx="13" cy="-11" r="1" fill="#0f3d24"/>
    <!-- legs -->
    <rect x="-2" y="14" width="1.6" height="6" fill="#7a3b14"/>
    <rect x="4"  y="14" width="1.6" height="6" fill="#7a3b14"/>
  </g>
</svg>
